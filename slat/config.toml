# Needs: a Nerd Font in your terminal, and true colour.
# Chevron separators, Nord palette, a clock on the right.

[theme]
name = "nord"
# >>> themely colors
bg = "#29271a"
fg = "#eeebd3"
dim = "#d5cd90"
accent = "#c4c0a2"
border = "#4e4b31"
tab_bg = "#3b3926"
tab_fg = "#d5cd90"
tab_active_bg = "#c4c0a2"
tab_active_fg = "#29271a"
# <<< themely

[borders]
style = "rounded"

[animation]
split  = "120ms"
move   = "140ms"
easing = "out-back"   # overshoots slightly, then settles

[status]
left  = " {workspace} {tabs}"
tab   = " {index} {name}{alert} "
right = "{badge} {pane}/{panes}  {time} "
alert = " ●"
