# Needs: a Nerd Font in your terminal, and true colour.
# Chevron separators, Nord palette, a clock on the right.

[theme]
name = "nord"
# >>> themely colors
bg = "#19291f"
fg = "#d3eedd"
dim = "#90d5a9"
accent = "#50c87c"
border = "#30503c"
tab_bg = "#243d2d"
tab_fg = "#90d5a9"
tab_active_bg = "#50c87c"
tab_active_fg = "#19291f"
# <<< themely

[borders]
style = "rounded"

[animation]
split  = "120ms"
move   = "140ms"
easing = "out-back"   # overshoots slightly, then settles

[status]
left  = " {workspace} {tabs}"
tab   = " {index} {name}{alert} "
right = "{badge} {pane}/{panes}  {time} "
alert = " ●"
