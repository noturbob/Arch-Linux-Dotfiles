# Needs: a Nerd Font in your terminal, and true colour.
# Chevron separators, Nord palette, a clock on the right.

[theme]
name = "nord"
# >>> themely colors
bg = "#191f29"
fg = "#d3ddee"
dim = "#90a9d5"
accent = "#547dc5"
border = "#303b50"
tab_bg = "#242d3d"
tab_fg = "#90a9d5"
tab_active_bg = "#547dc5"
tab_active_fg = "#191f29"
# <<< themely

[borders]
style = "rounded"

[animation]
split  = "120ms"
move   = "140ms"
easing = "out-back"   # overshoots slightly, then settles

[status]
left  = " {workspace} {tabs}"
tab   = " {index} {name}{alert} "
right = "{badge} {pane}/{panes}  {time} "
alert = " ●"
