# hyprlock · lock screen. Colors come from themely (the block below); the layout is yours.

# >>> themely colors
$bg = rgba(191f29d9)
$surface = rgb(303b50)
$fg = rgb(d3ddee)
$muted = rgb(90a9d5)
$accent = rgb(547dc5)
$accent2 = rgb(54acc5)
$red = rgb(f38ba8)
$yellow = rgb(f9e2af)
# <<< themely

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/agony/.config/themely/current/wallpaper
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# clock
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = CommitMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date "+%A, %d %B"
    color = $muted
    font_size = 18
    font_family = CommitMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    rounding = 22
    outline_thickness = 2
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    font_family = CommitMono Nerd Font
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    placeholder_text = Password
    check_color = $accent2
    fail_color = $red
    fail_text = $FAIL ($ATTEMPTS)
    capslock_color = $yellow
    position = 0, -40
    halign = center
    valign = center
}
