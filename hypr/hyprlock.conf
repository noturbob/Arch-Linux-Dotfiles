# hyprlock · lock screen. Colors come from themely (the block below); the layout is yours.

# >>> themely colors
$bg = rgba(291919d9)
$surface = rgb(503030)
$fg = rgb(eed3d3)
$muted = rgb(d59090)
$accent = rgb(ff1a1b)
$accent2 = rgb(ff1a7a)
$red = rgb(f38ba8)
$yellow = rgb(f9e2af)
# <<< themely

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/agony/.config/themely/current/wallpaper
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# clock
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = CommitMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date "+%A, %d %B"
    color = $muted
    font_size = 18
    font_family = CommitMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# password: no box, just the label and dots on the wallpaper (text size follows the height)
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 0
    inner_color = rgba(00000000)
    font_color = $fg
    font_family = CommitMono Nerd Font
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $FAIL ($ATTEMPTS)
    position = 0, -40
    halign = center
    valign = center
}
